<template>
    <lightning-card title="Smart Customer Support" icon-name="standard:case">
        <div class="slds-p-around_medium">

            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                Register a Complaint
            </h2>

            <lightning-input
                label="Customer Name"
                value={customerName}
                onchange={handleNameChange}
                required>
            </lightning-input>

            <lightning-input
                label="Customer Email"
                type="email"
                value={customerEmail}
                onchange={handleEmailChange}
                required>
            </lightning-input>

            <lightning-input
                label="Subject"
                value={subject}
                onchange={handleSubjectChange}
                required>
            </lightning-input>

            <lightning-textarea
                label="Description"
                value={description}
                onchange={handleDescriptionChange}
                required>
            </lightning-textarea>

            <lightning-combobox
                label="Complaint Category"
                value={category}
                options={categoryOptions}
                onchange={handleCategoryChange}
                required>
            </lightning-combobox>

            <lightning-combobox
                label="Priority"
                value={priority}
                options={priorityOptions}
                onchange={handlePriorityChange}
                required>
            </lightning-combobox>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Submit Complaint"
                    variant="brand"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>

            <template if:true={successMessage}>
                <p class="slds-text-color_success slds-m-top_medium">
                    {successMessage}
                </p>
            </template>

        </div>
    </lightning-card>

    <lightning-card title="Registered Complaints" class="slds-m-top_medium">
        <div class="slds-p-around_medium">

            <lightning-input
                type="search"
                label="Search Complaints"
                value={searchKey}
                onchange={handleSearch}>
            </lightning-input>

            <lightning-combobox
                label="Filter by Status"
                value={selectedStatus}
                options={statusOptions}
                onchange={handleStatusFilter}>
            </lightning-combobox>

            <lightning-datatable
                key-field="Id"
                data={filteredComplaints}
                columns={columns}
                onrowaction={handleRowAction}>
            </lightning-datatable>

        </div>
    </lightning-card>
</template>
